
spring.application.name=swe307-web

server.port=8080

# Default development profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:stub}

# MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bigdata?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=bduser
spring.datasource.password=${SWE307_MYSQL_PASSWORD}

# HDFS and Spark integration - B2
p3.hdfs.webhdfs-url=http://localhost:9870/webhdfs/v1
p3.hdfs.photo-dir=/photos
p3.spark.master=local[2]
